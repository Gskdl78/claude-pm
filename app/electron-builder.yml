appId: local.claude-pm
productName: claude-pm
npmRebuild: false
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/node-pty/**
extraResources:
  - from: ../plugin
    to: plugin
    filter:
      - "**/*"
      - "!tests/**"
      - "!node_modules/**"
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
